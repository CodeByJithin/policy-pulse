<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings — Premium Collection Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/premiums.js"></script>
  <script src="../js/whatsapp.js"></script>
  <script src="../js/payments.js"></script>
  <script src="../js/followups.js"></script>
  <script src="../js/customers.js"></script>
  <script src="../js/policies.js"></script>
  <script src="../js/reports.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    async function initSettingsPage() {
      const content = initAppShell('settings');
      const p = CURRENT_PROFILE;
      content.innerHTML = `
        <div class="section-header"><h2>Settings</h2></div>
        <div class="card mb-6" style="max-width:520px">
          <h4 class="mb-4">Profile</h4>
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="s-name" value="${escapeHtml(p.full_name)}">
          </div>
          <div class="form-group">
            <label class="form-label">Mobile</label>
            <input type="tel" class="form-control" id="s-mobile" value="${escapeHtml(p.mobile || '')}">
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" value="${escapeHtml(p.email || '')}" disabled>
            <div class="form-hint">Email cannot be changed here. Contact your administrator.</div>
          </div>
          <div class="form-group">
            <label class="form-label">Role</label>
            <input type="text" class="form-control" value="${p.role === 'manager' ? 'Manager' : 'Agent'}" disabled>
          </div>
          <button class="btn btn-primary" id="save-profile-btn">Save Changes</button>
        </div>

        <div class="card mb-6" style="max-width:520px">
          <h4 class="mb-4">Change Password</h4>
          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" id="s-new-password" minlength="6">
          </div>
          <button class="btn btn-secondary" id="change-password-btn">Update Password</button>
        </div>

        <div class="card" style="max-width:520px">
          <h4 class="mb-2">About</h4>
          <p class="text-secondary" style="font-size:var(--fs-sm)">Premium Collection Tracker uses WhatsApp click-to-chat only. No message is ever sent automatically — every WhatsApp reminder requires you to manually send it and confirm.</p>
          <p class="text-muted mt-3" style="font-size:var(--fs-xs)">Application timezone: ${APP_TIMEZONE}</p>
        </div>
      `;

      document.getElementById('save-profile-btn').addEventListener('click', async (e) => {
        const name = document.getElementById('s-name').value.trim();
        const mobile = document.getElementById('s-mobile').value.trim();
        if (!name) { showError('Name is required.'); return; }
        setButtonLoading(e.target, true, 'Saving…');
        const { error } = await supabaseClient.from('profiles').update({ full_name: name, mobile: mobile || null }).eq('id', p.id);
        if (error) { showError(friendlyError(error)); setButtonLoading(e.target, false); return; }
        showSuccess('Profile updated successfully.');
        setButtonLoading(e.target, false);
      });

      document.getElementById('change-password-btn').addEventListener('click', async (e) => {
        const pw = document.getElementById('s-new-password').value;
        if (!pw || pw.length < 6) { showError('Password must be at least 6 characters.'); return; }
        setButtonLoading(e.target, true, 'Updating…');
        try {
          await updatePassword(pw);
          showSuccess('Password updated successfully.');
          document.getElementById('s-new-password').value = '';
        } catch (err) {
          showError(friendlyError(err));
        }
        setButtonLoading(e.target, false);
      });
    }

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;
      await initSettingsPage();
    })();
  </script>
</body>
</html>
