<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password — Premium Collection Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body style="background:var(--color-bg)">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--sp-4)">
    <div class="card" style="width:100%;max-width:400px">
      <h3 class="mb-4">Set a New Password</h3>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" id="new-password" required minlength="6">
      </div>
      <button class="btn btn-primary btn-block" id="save-password-btn">Save Password</button>
      <div id="reset-result" class="mt-2" style="font-size:var(--fs-sm)"></div>
    </div>
  </div>
  <script src="../js/supabase.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.getElementById('save-password-btn').addEventListener('click', async (e) => {
      const pw = document.getElementById('new-password').value;
      const resultEl = document.getElementById('reset-result');
      if (!pw || pw.length < 6) { resultEl.textContent = 'Password must be at least 6 characters.'; resultEl.className = 'form-error mt-2'; return; }
      setButtonLoading(e.target, true, 'Saving…');
      try {
        await updatePassword(pw);
        resultEl.textContent = 'Password updated. Redirecting to login…';
        resultEl.className = 'text-success mt-2';
        await supabaseClient.auth.signOut();
        setTimeout(() => window.location.href = 'login.html', 1500);
      } catch (err) {
        resultEl.textContent = friendlyError(err);
        resultEl.className = 'form-error mt-2';
        setButtonLoading(e.target, false);
      }
    });
  </script>
</body>
</html>
